name: Refresh summons data

on:
  schedule:
    # Every day at 06:00 UTC (~01:00 ET in winter, ~02:00 ET in summer)
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/fetch_summons.py"
      - ".github/workflows/refresh-data.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python scripts/fetch_summons.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summons_data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh summons_data.json [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            git push
          fi
